file_format: definition/2
entities:
  - type: gen_ai.agent
    stability: development
    brief: >
      A Generative AI agent.
    note: >
      This entity SHOULD be used to capture the active agent when it's possible
      to associate an OpenTelemetry SDK instance with a specific agent.

      As noted on `gen_ai.agent.id`, transient in-memory or process-local identifiers
      MUST NOT be used. If no stable identifier is available, the agent entity is
      not emitted, and instrumentation continues to report `gen_ai.agent.name` at
      the span level when relevant.

      When multiple top-level agents can be active within the scope of a single
      OpenTelemetry SDK instance, these attributes MAY be recorded on the
      corresponding telemetry items instead.
    identity:
      - ref: gen_ai.agent.id
        requirement_level: required
    description:
      - ref: gen_ai.agent.name
      - ref: gen_ai.agent.description
