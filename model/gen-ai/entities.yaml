file_format: definition/2
entities:
  - type: gen_ai.server.agent
    stability: development
    brief: >
      The Generative AI server agent exposed to external callers.
    note: >
      This entity identifies the externally visible agent service (for example,
      the hosted agent configured in a cloud provider console, or declared in an
      Agent-to-Agent (A2A) Agent Card). It SHOULD be used when it is possible to
      associate an OpenTelemetry SDK instance with that externally visible root agent.

      As noted on [gen_ai.server.agent.id](/docs/registry/attributes/gen-ai.md),
      transient in-memory or process-local identifiers MUST NOT be used. If no stable
      identifier is available, the server agent entity MUST NOT be emitted.

      When internal helper agents, subagents, or orchestrators are active within the
      service process, their attributes SHOULD be recorded on signal-level telemetry
      items (such as [gen_ai.agent.name](/docs/registry/attributes/gen-ai.md)) instead.
    identity:
      - ref: gen_ai.server.agent.id
        requirement_level: required
    description:
      - ref: gen_ai.server.agent.name
      - ref: gen_ai.server.agent.description
