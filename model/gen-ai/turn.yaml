file_format: definition/2
spans:
  - type: gen_ai.handle_turn.internal
    requirement_level: recommended
    kind: internal
    name:
      note: >
        **Span name** SHOULD be `handle_turn {gen_ai.main_agent.name}` if `gen_ai.main_agent.name`
        is readily available. When it is not available, it SHOULD be `handle_turn`.
    brief: >
      Represents handling of one request to the agentic system.
    note: |
      The `gen_ai.operation.name` SHOULD be `handle_turn`.

      The turn span is the outermost GenAI operation in a process. It covers everything done
      to handle a single request to the agentic system: agent invocations, workflows,
      inference, tool calls, retrieval, and memory operations, including handoffs between
      several agents.

      Instrumentations SHOULD report a turn span when they can reliably bound a request to the
      agentic system and no other GenAI turn operation is present in the context.

      Operations internal to handling a request are not turns and SHOULD NOT be reported as such.
      This includes inference, tool calls, retrieval, and memory operations, as well as invocations
      of sub-agents and nested workflows, regardless of whether the instrumentation that reports
      them can observe the enclosing turn.

      **Span kind** is always `INTERNAL`. The turn is a logical boundary, not a transport one.
      When the agentic system is reached over a network protocol, the protocol instrumentation
      reports the `SERVER` span and the turn span is nested under it.

      The entity that owns the turn may be an agent, a workflow, or an application-specific
      entry point. `gen_ai.main_agent.name` identifies it in all cases; `gen_ai.agent.name` and
      `gen_ai.workflow.name` describe what it is when applicable.

      The turn span is reported independently of what handles the request, including when a
      single agent handles it end to end. In that case the `invoke_agent` span for that agent
      is reported as a child of the turn span and the two have the same duration.
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.operation.name
        requirement_level: required
        sampling_relevant: true
      - ref: gen_ai.main_agent.name
        requirement_level:
          conditionally_required: When available.
        sampling_relevant: true
      - ref: gen_ai.agent.name
        brief: The human-readable name of the agent that owns the turn.
        requirement_level:
          conditionally_required: When the turn is owned by an agent and the name is available.
      - ref: gen_ai.workflow.name
        requirement_level:
          conditionally_required: When the turn is owned by a workflow and the name is available.
      - ref: gen_ai.conversation.id
        requirement_level:
          conditionally_required: If and only if the instrumented library has one readily available, or the user application provides one through OpenTelemetry context or library-specific mechanisms.
      - ref: gen_ai.input.messages
        requirement_level: opt_in
      - ref: gen_ai.output.messages
        requirement_level: opt_in

metrics:
  - name: gen_ai.handle_turn.duration
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
    brief: 'The duration of handling one request to the agentic system.'
    note: >
      Measured from the point where the agentic system starts handling a request to the point
      where it produces its final response or fails.

      This is the system-level latency metric: exactly one value is recorded per request, no
      matter how many agents, workflows, or inference calls the request fans out into. Use
      `gen_ai.invoke_agent.duration` to measure individual agent and workflow invocations.

      This metric is reported in addition to `gen_ai.invoke_agent.duration`, including when a
      single agent handles the request end to end and the two record the same duration.

      This metric SHOULD be reported under the same conditions as the `gen_ai.handle_turn.internal`
      span: only when the instrumentation can reliably bound a request to the agentic system and no
      other GenAI turn operation is present in the context. This keeps exactly one measurement per
      request when several instrumented frameworks or agents are nested. The metric value SHOULD be
      the same as the span duration.
    instrument: histogram
    unit: "s"
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.main_agent.name
        requirement_level:
          conditionally_required: When available.
