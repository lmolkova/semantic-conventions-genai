# Project-level Weaver configuration, discovered by walking up from the registry
# (./model). Customizes the shared markdown documentation template package
# (opentelemetry-weaver-packages/templates/docs/markdown) for this repo without
# forking it: acronyms and text maps are layered on top of the package defaults.
[template]
# Initialisms that must stay fully upper-cased when a namespace heading is
# title-cased (e.g. the `gen_ai` namespace renders as "GenAI"). Unioned with the
# package's default acronyms; on a case-insensitive collision our value wins.
acronyms = ["AI", "AWS", "Bedrock", "GenAI", "MCP", "OpenAI"]

# Term -> replacement maps consumed by weaver's text-mapping filters.
[template.text_maps.namespace_mapping]
gen_ai = "GenAI"

# Where each dependency's attributes are documented, keyed by the dependency's
# `schema_url` in model/manifest.yaml. Attributes we import from upstream link
# here; ones from an unlisted dependency render unlinked. Keep the version in
# the url in sync with SEMCONV_VERSION in versions.env.
[template.text_maps.upstream_docs]
"https://opentelemetry.io/schemas/1.41.0" = "https://github.com/open-telemetry/semantic-conventions/blob/v1.42.0/docs/registry/attributes/{namespace}.md"
