runner: genai-conformance
instrumented_library: cohere
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    expected_violations:
      # TODO: update mock to return model in chat and embed responses
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: Cohere v2 chat response does not include a model field; mock omits it too.
      - id: genai_expected_attribute_missing
        context:
          operation: embeddings
          missing_attribute: gen_ai.response.model
        reason: Cohere v2 embed response does not include a model field; mock omits it too.
