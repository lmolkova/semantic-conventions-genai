runner: genai-conformance
instrumented_library: agent-framework
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    expected_violations:
      # Native telemetry gaps - issues in the library's own instrumentation
      - id: genai_content_schema
        reason: Agent Framework native telemetry omits finish_reason from output messages.
      - id: genai_span_kind_unexpected
        reason: Agent Framework native telemetry emits chat spans with INTERNAL kind instead of CLIENT.
      - id: missing_attribute
        reason: Agent Framework uses proprietary attribute namespaces (agent_framework.*, edge_group.*, executor.*, message.*, workflow.*) not in the OTel registry.
      - id: type_mismatch
        reason: Agent Framework native telemetry sets gen_ai.response.finish_reasons as a string instead of string[].
      - id: unit_mismatch
        reason: Agent Framework native telemetry uses 'tokens' instead of '{token}' for token count metrics.
      - id: missing_metric
        reason: Agent Framework emits custom metrics not defined in the OTel GenAI registry.
