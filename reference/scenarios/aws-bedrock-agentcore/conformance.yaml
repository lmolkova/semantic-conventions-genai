runner: genai-conformance
instrumented_library: aws-bedrock-agentcore
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    expected_violations:
      # Memory operations are experimental and not yet in the semconv operation name enum
      - id: genai_operation_name_unknown
        context: {operation: create_memory}
        reason: Memory operation conventions are experimental; create_memory is not yet a documented enum value.
      - id: genai_operation_name_unknown
        context: {operation: create_memory_store}
        reason: Memory operation conventions are experimental; create_memory_store is not yet a documented enum value.
      - id: genai_operation_name_unknown
        context: {operation: delete_memory}
        reason: Memory operation conventions are experimental; delete_memory is not yet a documented enum value.
      - id: genai_operation_name_unknown
        context: {operation: delete_memory_store}
        reason: Memory operation conventions are experimental; delete_memory_store is not yet a documented enum value.
      - id: genai_operation_name_unknown
        context: {operation: search_memory}
        reason: Memory operation conventions are experimental; search_memory is not yet a documented enum value.
      - id: genai_operation_name_unknown
        context: {operation: update_memory}
        reason: Memory operation conventions are experimental; update_memory is not yet a documented enum value.
