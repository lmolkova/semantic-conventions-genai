runner: genai-conformance
instrumented_library: google-adk
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    expected_violations:
      # Memory operations are not yet in the semconv operation name enum
      - id: genai_operation_name_unknown
        context: {operation: search_memory}
        reason: Memory operation conventions are experimental; search_memory is not yet a documented enum value.
      - id: genai_operation_name_unknown
        context: {operation: upsert_memory}
        reason: Memory operation conventions are experimental; upsert_memory is not yet a documented enum value.
      # TODO: fix metric unit emission for inference_calls and tool_calls histograms
      - id: unit_mismatch
        reason: OTel SDK exports histogram unit as '1' instead of '{inference_call}' and '{tool_call}' for invoke_agent metrics.
