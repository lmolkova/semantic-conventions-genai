runner: genai-conformance
instrumented_library: google-adk
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    spans:
      - match:
          attributes:
            gen_ai.tool.name: load_skill
          kind: internal
          type: gen_ai.execute_tool.load_skill.internal
      - match:
          attributes:
            gen_ai.tool.name: load_skill_resource
          kind: internal
          type: gen_ai.execute_tool.read_skill_resource.internal
      - match:
          attributes:
            gen_ai.tool.name: run_skill_script
          kind: internal
          type: gen_ai.execute_tool.command.internal
