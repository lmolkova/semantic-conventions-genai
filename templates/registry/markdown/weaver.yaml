# Local v2 markdown templates. See plan at .claude/plans/encapsulated-exploring-flamingo.md.
#
# Filters operate on the resolved registry that `weaver registry generate --v2`
# hands to templates. Shape:
#   .registry.attributes -- fully inlined attribute objects, contains only
#                           locally-owned attributes (verified empirically).
#   .registry.{spans,metrics,events,attribute_groups,entities} -- local signals.
#   .refinements.{spans,metrics,events,...} -- refinement definitions.
#   .schema_url -- the local registry's schema URL.
# Each attribute carries `provenance.path` pointing at the model file.
#
# Namespace bucketing: split the attribute key on `.` and group by the first
# segment. `aws.bedrock.*` therefore lands under "aws"; refine by hand-list if
# we ever need finer granularity.
jq_modules:
  - jq/docs.jq

templates:
  - pattern: attribute_namespace.md.j2
    filter: semconv_grouped_attributes({"v2":true})
    application_mode: each
    file_name: "{{ ctx.root_namespace | kebab_case }}/attributes.md"

  # Index of entities (and entity refinements) per namespace.
  - template: entities_readme.md.j2
    filter: entities_index
    application_mode: each
    file_name: "{{ ctx.namespace | kebab_case }}/entities/README.md"

  # One page per signal: <ns>/<operation>/<signal>/<id>.md (<ns> from the signal
  # id, operation from `annotations.docs.operation`), entities in <ns>/entities/.
  # Filters live in jq/docs.jq.
  - template: signal_page.md.j2
    filter: signal_pages
    application_mode: each
    file_name: "{% import 'operations.j2' as ops %}{{ ops.signal_path(ctx.operation, ctx.signal, ctx.id, ctx.item._refines is defined and ctx.item._refines) | trim }}"

text_maps:
  # Operations documented on their namespace README instead of their own folder.
  operation_docs:
    mcp.client: /docs/mcp/README.md
    mcp.server: /docs/mcp/README.md
    a2a.client: /docs/a2a/README.md
    a2a.server: /docs/a2a/README.md
  operation_titles:
    gen_ai.client.inference: Client Inference
    gen_ai.server.inference: Server Inference
    gen_ai.client.realtime_inference: Client Realtime Inference
    gen_ai.client.embeddings: Client Embeddings
    gen_ai.retrieval: Retrieval
    gen_ai.client.fetch_response: Client Fetch Response
    gen_ai.client.memory: Client Memory
    gen_ai.client.create_agent: Client Create Agent
    gen_ai.client.invoke_agent: Client Invoke Agent
    gen_ai.invoke_agent: Invoke Agent
    gen_ai.execute_tool: Execute Tool
    gen_ai.plan: Plan
    gen_ai.evaluation: Evaluation
    mcp.client: MCP Client
    mcp.server: MCP Server
    a2a.client: A2A Client
    a2a.server: A2A Server

acronyms:
  - A2A
  - AI
  - AWS
  - Bedrock
  - GenAI
  - MCP
  - OpenAI
